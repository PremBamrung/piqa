<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    display: grid; grid-template-columns: 1fr 340px; height: 100vh;
    background: #0f0f0f; color: #ccc; font-family: system-ui, sans-serif; overflow: hidden;
  }
  #plot { min-width: 0; }
  #side {
    background: #151515; border-left: 1px solid #262626; padding: 16px;
    display: flex; flex-direction: column; gap: 10px; overflow-y: auto;
  }
  #side h1 { font-size: 14px; font-weight: 600; color: #eee; }
  #count, #hint { font-size: 12px; color: #666; }
  #preview {
    width: 100%; aspect-ratio: 1; object-fit: contain; background: #0b0b0b;
    border-radius: 4px; display: none; cursor: zoom-in;
  }
  #name { font: 12px ui-monospace, monospace; color: #bbb; word-break: break-all; }
  #folder { font: 11px ui-monospace, monospace; color: #666; word-break: break-all; }
  @media (max-width: 800px) {
    body { grid-template-columns: 1fr; grid-template-rows: 1fr 260px; }
    #side { border-left: 0; border-top: 1px solid #262626; }
  }
</style>
<script>/*{{PLOTLY_JS}}*/</script>
</head>
<body>
<div id="plot"></div>
<aside id="side">
  <h1>{{TITLE}}</h1>
  <div id="count"></div>
  <div id="hint">Hover a point to preview it. Click a point or the preview to open the original.</div>
  <img id="preview" alt="">
  <div id="name"></div>
  <div id="folder"></div>
</aside>
<script>
const DATA = /*{{DATA}}*/;
const ITEMS = DATA.items;
const $ = id => document.getElementById(id);
let current = -1;

const traces = DATA.groups.map((g, gi) => {
  const idx = [];
  ITEMS.forEach((it, i) => { if (it.g === gi) idx.push(i); });
  return {
    type: 'scattergl', mode: 'markers', name: g.name,
    x: idx.map(i => ITEMS[i].x), y: idx.map(i => -ITEMS[i].y),
    text: idx.map(i => ITEMS[i].name), customdata: idx,
    hovertemplate: '%{text}<extra></extra>',
    marker: { size: 6, color: g.color, opacity: 0.85 },
  };
});

const axis = { visible: false, zeroline: false };
const layout = {
  paper_bgcolor: '#0f0f0f', plot_bgcolor: '#0f0f0f', font: { color: '#bbb' },
  xaxis: axis, yaxis: { ...axis, scaleanchor: 'x', scaleratio: 1 },
  hovermode: 'closest', showlegend: DATA.groups.length > 1,
  legend: { bgcolor: 'rgba(0,0,0,0.4)', font: { size: 11 } },
  margin: { t: 10, b: 10, l: 10, r: 10 },
};

const gd = $('plot');
Plotly.newPlot(gd, traces, layout, { responsive: true, displaylogo: false });
$('count').textContent = `${ITEMS.length} images · ${DATA.groups.length} groups`;

function show(i) {
  const it = ITEMS[i];
  current = i;
  $('preview').src = it.m;
  $('preview').style.display = 'block';
  $('name').textContent = it.name;
  $('folder').textContent = it.dir;
  $('hint').style.display = 'none';
}
const openOriginal = i => { if (i >= 0) window.open(ITEMS[i].orig, '_blank'); };

// The preview persists after the cursor leaves the point (no unhover handler on purpose).
gd.on('plotly_hover', ev => show(ev.points[0].customdata));
gd.on('plotly_click', ev => openOriginal(ev.points[0].customdata));
$('preview').addEventListener('click', () => openOriginal(current));
</script>
</body>
</html>
