[project]
name = "piqa"
version = "0.1.0"
description = "Photo culling and exploration for Fuji JPEG/RAF libraries"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "plotly>=6.0",
    "torch>=2.7",
    "torchvision>=0.22",
    "tqdm>=4.66",
    "umap-learn>=0.5.7",
]

[project.scripts]
piqa = "piqa.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# CUDA 12.8 wheels (needed for the RTX 50xx series) on Windows/Linux; default wheels (MPS) on macOS.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
